<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheetTravel Pro | Fleet Management</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .lucide-icon { display: inline-block; vertical-align: middle; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signOut,
            signInAnonymously,
            signInWithCustomToken
        } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            onSnapshot, 
            updateDoc, 
            collection,
            getDoc
        } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // --- CONFIGURATION ---
        // Your specific Firebase configuration for GitHub Pages deployment
        const fallbackConfig = {
            apiKey: "AIzaSyDYYzeP0ksqlgxijfRGmUrzudydYMPzomI",
            authDomain: "ai-studio-applet-webapp-5eea4.firebaseapp.com",
            projectId: "ai-studio-applet-webapp-5eea4",
            storageBucket: "ai-studio-applet-webapp-5eea4.firebasestorage.app",
            messagingSenderId: "337797489497",
            appId: "1:337797489497:web:e7467a156b52e16243a248"
        };

        const ADMIN_EMAILS = ["gabrielstarknight@gmail.com"]; 
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sheet-travel-pro';

        async function initFirebase() {
            try {
                let config;
                
                // Try environment variable first (Canvas internal), then fallback to your manual config (GitHub)
                if (typeof __firebase_config !== 'undefined') {
                    config = JSON.parse(__firebase_config);
                } else {
                    config = fallbackConfig;
                }

                const app = initializeApp(config);
                const auth = getAuth(app);
                const db = getFirestore(app);

                // Authentication Logic
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    // Start an anonymous session so the database can be reached if open,
                    // but allow user to upgrade to Google Auth later.
                    signInAnonymously(auth).catch(() => {});
                }

                window.FirebaseOps = { 
                    auth, db, GoogleAuthProvider, signInWithPopup, signOut, 
                    onAuthStateChanged, doc, setDoc, onSnapshot, updateDoc, 
                    collection, getDoc, appId, ADMIN_EMAILS,
                    isReady: true 
                };
            } catch (error) {
                console.error("Firebase Setup Error:", error);
                window.FirebaseOps = { error: error.message, isReady: true };
            }
        }

        initFirebase();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    window.lucide.createIcons();
                }
            }, [name]);

            return (
                <i data-lucide={name} className={`lucide-icon ${className}`} style={{ width: size, height: size }}></i>
            );
        };

        function App() {
            const [ops, setOps] = useState(null);
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [allUsers, setAllUsers] = useState([]);
            const [view, setView] = useState('dashboard');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const checkOps = setInterval(() => {
                    if (window.FirebaseOps && window.FirebaseOps.isReady) {
                        setOps(window.FirebaseOps);
                        clearInterval(checkOps);
                    }
                }, 100);
                return () => clearInterval(checkOps);
            }, []);

            useEffect(() => {
                if (!ops || ops.error) return;
                const unsub = ops.onAuthStateChanged(ops.auth, (u) => {
                    setUser(u);
                    if (!u) setLoading(false);
                });
                return () => unsub();
            }, [ops]);

            useEffect(() => {
                if (!ops || !user || user.isAnonymous) {
                    if (user?.isAnonymous) setLoading(false);
                    return;
                }

                const userRef = ops.doc(ops.db, 'artifacts', ops.appId, 'public', 'data', 'users', user.uid);
                
                const unsub = ops.onSnapshot(userRef, async (snap) => {
                    if (!snap.exists()) {
                        const isEmailAdmin = user.email && ops.ADMIN_EMAILS.includes(user.email.toLowerCase());
                        const newProfile = {
                            uid: user.uid,
                            email: user.email || 'Anonymous',
                            displayName: user.displayName || 'Guest User',
                            photoURL: user.photoURL || '',
                            status: isEmailAdmin ? 'approved' : 'pending',
                            createdAt: new Date().toISOString()
                        };
                        await ops.setDoc(userRef, newProfile);
                        setUserData(newProfile);
                    } else {
                        setUserData(snap.data());
                    }
                    setLoading(false);
                }, (err) => {
                    console.error("Profile sync error:", err);
                    setLoading(false);
                });

                return () => unsub();
            }, [ops, user]);

            useEffect(() => {
                const isAdmin = user && user.email && ops?.ADMIN_EMAILS.includes(user.email.toLowerCase());
                if (!ops || !user || !isAdmin) return;

                const usersCol = ops.collection(ops.db, 'artifacts', ops.appId, 'public', 'data', 'users');
                return ops.onSnapshot(usersCol, (snap) => {
                    setAllUsers(snap.docs.map(d => d.data()));
                }, (err) => console.error("Admin listener error:", err));
            }, [ops, user]);

            const handleSignIn = async () => {
                try {
                    const provider = new ops.GoogleAuthProvider();
                    await ops.signInWithPopup(ops.auth, provider);
                } catch (e) {
                    console.error("Sign in error:", e);
                }
            };

            if (ops?.error) return (
                <div className="min-h-screen flex items-center justify-center bg-rose-50 p-6">
                    <div className="bg-white p-8 rounded-3xl shadow-xl border border-rose-100 max-w-sm text-center">
                        <Icon name="alert-triangle" className="text-rose-500 mx-auto mb-4" size={48} />
                        <h2 className="text-xl font-bold text-slate-900">Connection Error</h2>
                        <p className="text-slate-500 text-sm mt-2">{ops.error}</p>
                        <p className="text-[10px] text-slate-400 mt-4 uppercase font-bold">Check fallbackConfig in index.html</p>
                    </div>
                </div>
            );

            if (loading || !ops) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-white">
                    <Icon name="plane" size={48} className="text-indigo-600 animate-bounce" />
                    <p className="mt-4 text-[10px] font-black uppercase tracking-widest text-slate-400">Synchronizing Fleet...</p>
                </div>
            );

            if (!user || user.isAnonymous) {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-6">
                        <div className="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-10 space-y-8 animate-in text-center border border-slate-100">
                            <div className="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto text-white shadow-lg">
                                <Icon name="plane" size={32} />
                            </div>
                            <div>
                                <h1 className="text-3xl font-black text-slate-900">SheetTravel Pro</h1>
                                <p className="text-slate-500 font-medium">Logistics & Fleet Management</p>
                            </div>
                            <button onClick={handleSignIn} className="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3 hover:bg-slate-800 transition-all shadow-xl active:scale-95">
                                <Icon name="log-in" size={20} /> Continue with Google
                            </button>
                        </div>
                    </div>
                );
            }

            if (userData?.status === 'pending') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="max-w-sm w-full bg-white rounded-[2.5rem] shadow-2xl p-12 text-center space-y-4">
                            <div className="bg-amber-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto text-amber-600">
                                <Icon name="clock" size={40} />
                            </div>
                            <h2 className="text-2xl font-black text-slate-900">Access Restricted</h2>
                            <p className="text-slate-500 text-sm">Your clearance is currently under review by the administrator.</p>
                            <button onClick={() => ops.signOut(ops.auth)} className="text-rose-500 font-black uppercase text-[10px] tracking-widest hover:underline">Sign Out</button>
                        </div>
                    </div>
                );
            }

            const isAdminView = view === 'admin';

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <nav className="bg-white border-b px-8 py-4 flex items-center justify-between sticky top-0 z-20">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('dashboard')}>
                            <div className="bg-indigo-600 p-2 rounded-xl text-white">
                                <Icon name="plane" size={20} />
                            </div>
                            <span className="text-xl font-black tracking-tight text-slate-900">SheetTravel</span>
                        </div>
                        <div className="flex items-center gap-4">
                            {ops.ADMIN_EMAILS.includes(user.email?.toLowerCase()) && (
                                <button 
                                    onClick={() => setView(isAdminView ? 'dashboard' : 'admin')}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${isAdminView ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-500 hover:bg-slate-100'}`}
                                >
                                    {isAdminView ? 'Fleet View' : 'Admin Hub'}
                                </button>
                            )}
                            <button onClick={() => ops.signOut(ops.auth)} className="p-2 text-slate-400 hover:text-rose-500 transition-colors">
                                <Icon name="log-out" size={20} />
                            </button>
                        </div>
                    </nav>

                    <main className="flex-1 max-w-7xl w-full mx-auto p-8">
                        {isAdminView ? (
                            <div className="space-y-8 animate-in">
                                <h2 className="text-4xl font-black text-slate-900">Personnel Clearance</h2>
                                <div className="bg-white rounded-[2rem] border shadow-sm overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 border-b">
                                            <tr>
                                                <th className="px-8 py-5 text-[10px] font-black uppercase text-slate-400">Pilot</th>
                                                <th className="px-8 py-5 text-[10px] font-black uppercase text-slate-400">Status</th>
                                                <th className="px-8 py-5 text-[10px] font-black uppercase text-slate-400 text-right">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {allUsers.map(u => (
                                                <tr key={u.uid} className="hover:bg-slate-50 transition-colors">
                                                    <td className="px-8 py-5 flex items-center gap-4">
                                                        <div className="w-10 h-10 rounded-full bg-slate-100 overflow-hidden">
                                                            {u.photoURL ? <img src={u.photoURL} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center font-bold text-slate-300">{u.displayName[0]}</div>}
                                                        </div>
                                                        <div>
                                                            <div className="font-bold text-sm text-slate-900">{u.displayName}</div>
                                                            <div className="text-xs text-slate-400">{u.email}</div>
                                                        </div>
                                                    </td>
                                                    <td className="px-8 py-5">
                                                        <span className={`px-3 py-1 rounded-full text-[10px] font-black uppercase ${u.status === 'approved' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                                                            {u.status}
                                                        </span>
                                                    </td>
                                                    <td className="px-8 py-5 text-right">
                                                        {u.status === 'pending' ? (
                                                            <button 
                                                                onClick={() => ops.updateDoc(ops.doc(ops.db, 'artifacts', ops.appId, 'public', 'data', 'users', u.uid), { status: 'approved' })}
                                                                className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-indigo-700 shadow-lg shadow-indigo-100"
                                                            >
                                                                Approve
                                                            </button>
                                                        ) : (
                                                            !ops.ADMIN_EMAILS.includes(u.email?.toLowerCase()) && (
                                                                <button 
                                                                    onClick={() => ops.updateDoc(ops.doc(ops.db, 'artifacts', ops.appId, 'public', 'data', 'users', u.uid), { status: 'pending' })}
                                                                    className="text-rose-500 font-black uppercase text-[10px] hover:bg-rose-50 px-3 py-1 rounded-lg"
                                                                >
                                                                    Revoke
                                                                </button>
                                                            )
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-12 animate-in">
                                <header className="flex justify-between items-end">
                                    <div>
                                        <h2 className="text-4xl font-black text-slate-900">Active Expeditions</h2>
                                        <p className="text-slate-500 font-medium mt-1">Welcome back, {user.displayName?.split(' ')[0] || 'Member'}</p>
                                    </div>
                                    <button className="bg-slate-900 text-white px-6 py-3 rounded-2xl font-bold flex items-center gap-2 hover:bg-slate-800 transition-all shadow-xl active:scale-95">
                                        <Icon name="plus" size={18} /> New Fleet Member
                                    </button>
                                </header>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                    <div className="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-2xl hover:-translate-y-1 transition-all group cursor-pointer">
                                        <div className="bg-indigo-50 text-indigo-600 w-14 h-14 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-indigo-600 group-hover:text-white transition-all">
                                            <Icon name="map" size={24} />
                                        </div>
                                        <h3 className="text-xl font-black text-slate-900">Fleet Dashboard</h3>
                                        <p className="text-sm text-slate-500 mt-2">Manage your current aircraft and travel logistics.</p>
                                        <div className="mt-8 flex items-center justify-between border-t pt-6">
                                            <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">0 Active Trips</span>
                                            <Icon name="chevron-right" className="text-slate-300 group-hover:text-indigo-600 transition-colors" />
                                        </div>
                                    </div>
                                    
                                    <div className="border-4 border-dashed border-slate-200 rounded-[2.5rem] flex flex-col items-center justify-center p-12 text-slate-300 hover:border-indigo-200 hover:bg-indigo-50/30 transition-all cursor-pointer group">
                                        <div className="p-4 bg-slate-50 rounded-full group-hover:bg-indigo-100 group-hover:text-indigo-600 transition-all">
                                            <Icon name="plus" size={32} />
                                        </div>
                                        <span className="font-bold text-sm mt-4 text-slate-400 group-hover:text-indigo-600">Register New Aircraft</span>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
